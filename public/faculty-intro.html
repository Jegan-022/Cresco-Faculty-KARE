body{margin:0;background:var(--void);color:var(--foam);font:15px/1.55 var(--body);overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:none}
.wrap{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}

.neb.a{left:calc(-12 * var(--su));top:calc(-26 * var(--su));width:calc(60 * var(--su));height:calc(60 * var(--su));background:radial-gradient(circle,rgba(110,70,230,.38),transparent 65%);animation:drift 6s ease-in-out infinite alternate}
.neb.b{right:calc(-14 * var(--su));bottom:calc(-30 * var(--su));width:calc(66 * var(--su));height:calc(66 * var(--su));background:radial-gradient(circle,rgba(255,77,134,.22),transparent 66%);animation:drift 7s ease-in-out infinite alternate-reverse}
.neb.c{left:calc(30 * var(--su));bottom:calc(-36 * var(--su));width:calc(50 * var(--su));height:calc(50 * var(--su));background:radial-gradient(circle,rgba(255,201,74,.16),transparent 66%);animation:drift 6.5s ease-in-out infinite alternate}

#net{position:absolute;inset:0;width:100%;height:100%;z-index:1;display:block}
.glow{position:absolute;left:50%;top:40%;width:calc(68 * var(--su));height:calc(68 * var(--su));margin:calc(-34 * var(--su)) 0 0 calc(-34 * var(--su));border-radius:50%;z-index:1;background:radial-gradient(circle,rgba(255,201,74,.3) 0%,rgba(138,107,255,.16) 36%,transparent 62%);filter:blur(5px)}
.flash{position:absolute;left:50%;top:40%;width:calc(24 * var(--su));height:calc(24 * var(--su));margin:calc(-12 * var(--su)) 0 0 calc(-12 * var(--su));border-radius:50%;z-index:1;background:radial-gradient(circle,#fff 0%,rgba(255,236,170,.9) 25%,transparent 68%);opacity:0}
.ring{position:absolute;left:50%;top:40%;width:calc(30 * var(--su));height:calc(30 * var(--su));margin:calc(-15 * var(--su)) 0 0 calc(-15 * var(--su));border-radius:50%;border:calc(.22 * var(--su)) solid var(--gold);opacity:0;z-index:1}

button:hover{background:#fff}button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.status{font:400 12px/1 var(--mono);color:var(--mist);letter-spacing:.04em}
